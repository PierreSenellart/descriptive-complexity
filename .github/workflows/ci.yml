name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository; the docs and update workflows ask for
# the extra scopes they need.
permissions:
  contents: read

# Collapse a burst of pushes onto the newest commit, as `docs.yml` does: a full
# Lean + Mathlib build is expensive, and a superseded one is of no interest.
# Pull requests are keyed separately from branches by `github.ref`.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs elan/Lean from lean-toolchain, runs `lake exe cache get`
      # (Mathlib is in the closure) and `lake build`; also runs any test and
      # lint targets it can auto-detect.
      - name: Build, test and lint
        uses: leanprover/lean-action@v1

  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The library version and the Mathlib pin are each recorded in several
      # files; this catches the one that was forgotten.
      - name: Check that every version and pin location agrees
        run: bash ./scripts/release.sh check

      - name: Validate CITATION.cff
        uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: "--validate"
