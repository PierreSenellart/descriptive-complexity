name: Documentation

# The site tracks `master`: every push rebuilds and redeploys it, so the
# published pages – and the commit-pinned source links in them, line numbers
# included – never lag the code. Releases and manual runs trigger it too; pull
# requests never do.
#
# The build is heavy – doc-gen4 covers the whole import closure, Mathlib
# included, and the dependency figures run `dot` once per declaration – so two
# things keep the per-push cost down: the documentation database is carried
# between runs (see the cache step), and a superseded build is cancelled.
on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

# Grant the GITHUB_TOKEN the permissions required to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build the API documentation
    runs-on: ubuntu-latest
    # Collapse a burst of pushes onto the newest commit: an in-flight build is
    # cancelled as soon as a later one starts. Scoped to this job, so that the
    # deploy job below – which must not be cancelled mid-deployment – keeps the
    # separate, non-cancelling `pages` group.
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install elan/Lean, fetch the Mathlib cache and build the library, so
      # that ../.lake/packages (shared with docbuild via packagesDir) is ready.
      # Plain (auto-config) usage guarantees `lake exe cache get` runs – without
      # the cache the doc build would recompile all of Mathlib from source.
      - name: Build the library
        uses: leanprover/lean-action@v1

      # doc-gen4 is incremental, over exactly these two paths: `doc-data/` holds
      # a Lake-traced marker and the serialized declaration data per module, and
      # `api-docs.db` is the database the HTML is rendered from. Carrying them
      # between runs means a push re-processes only the modules whose traces
      # changed, instead of the entire Mathlib closure every time.
      #
      # Cache entries are immutable, so the key carries the commit (each run
      # saves an updated entry) and `restore-keys` falls back to the newest
      # entry built against the same toolchain and dependency pins. Bumping any
      # of those four files therefore starts a fresh chain, which is the point:
      # a new Mathlib means the whole closure must be re-documented anyway.
      # `docbuild/lake-manifest.json` is deliberately not a key input – the
      # `lake update` step below rewrites it – so the doc-gen4 pin is read from
      # `docbuild/lakefile.toml`, where it is declared.
      #
      # A miss only costs time: the build is correct either way.
      - name: Restore the documentation database
        uses: actions/cache@v4
        with:
          path: |
            docbuild/.lake/build/doc-data
            docbuild/.lake/build/api-docs.db*
          key: >-
            docs-db-${{ hashFiles('lean-toolchain', 'lake-manifest.json',
            'docbuild/lean-toolchain', 'docbuild/lakefile.toml') }}-${{ github.sha }}
          restore-keys: >-
            docs-db-${{ hashFiles('lean-toolchain', 'lake-manifest.json',
            'docbuild/lean-toolchain', 'docbuild/lakefile.toml') }}-

      # The per-declaration dependency figures: `dot` renders them, and
      # result-graph produces them from the built oleans. It is not a
      # dependency of this library and is kept outside the workspace, so that
      # its own sources are never taken for part of it; it needs core Lean
      # only, so this build is seconds and needs no cache.
      - name: Build result-graph
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz
          git clone --depth 1 https://github.com/PierreSenellart/result-graph \
            "$RUNNER_TEMP/result-graph"
          cd "$RUNNER_TEMP/result-graph" && lake build

      # Pin/resolve doc-gen4 in the nested docbuild project and generate docs.
      # MATHLIB_NO_CACHE_ON_UPDATE=1 works around a Mathlib caching issue on
      # `lake update` (doc-gen4 README). `make docs` runs doc-gen4 and then
      # splices a figure into each declaration's page; see docbuild/Makefile.
      #
      # A module carried over from the cache keeps the source URL it was
      # documented with, which pins an *older* commit than this run's: doc-gen4
      # fetches the `srcUri` facet inside its up-to-date check, not as part of
      # the module's trace. That is correct, not stale – the module is in the
      # cache precisely because its content has not changed since, so the
      # permalink and its line numbers still resolve to what the page shows.
      - name: Build the documentation
        run: |
          cd docbuild
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update doc-gen4
          make docs RESULT_GRAPH_REPO="$RUNNER_TEMP/result-graph"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docbuild/.lake/build/doc

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Allow one concurrent Pages deployment; let an in-progress one finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
